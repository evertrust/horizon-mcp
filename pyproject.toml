[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-mcp-server"
version = "1.1.0"
description = "Production MCP server for Evertrust Horizon CLM"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pyjks>=20.0.0",
    "tenacity>=8.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
oidc = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[project.scripts]
horizon-mcp = "horizon_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live Horizon instance",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
